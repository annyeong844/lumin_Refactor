name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update

      - name: Verify formatting
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo fmt --all --check

  architecture-check:
    name: Architecture check
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      - name: Test source provenance bootstrap
        run: python -I -S tools/xtask/bootstrap/test_source_provenance.py

      - name: Enforce architecture policy
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- architecture-check

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      - name: Install dependency policy tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
          fallback: none

      - name: Audit RustSec advisories
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo audit --deny warnings

      - name: Enforce dependency policy
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo deny --locked check bans licenses sources

  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Record toolchain
        run: |
          rustc --version --verbose
          cargo --version

      - name: Lint all targets
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Lint retention crash corpus
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test retention_faults --features retention-test-crash --locked -- -D warnings

      - name: Lint lifecycle operation idempotency corpus
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test lifecycle_operation_idempotency --features lifecycle-test-fault --locked -- -D warnings

      - name: Lint publication crash corpus
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test publication_faults --features publication-test-crash --locked -- -D warnings

      - name: Lint concurrent publication corpus
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test publication_concurrency --features publication-test-crash --locked -- -D warnings

      - name: Lint publication retention race corpus
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test publication_retention_race --features publication-test-crash,retention-test-crash --locked -- -D warnings

      - name: Test all targets
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo test --workspace --all-targets --locked

      - name: Test retention crash corpus in isolated processes
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- corpus foundation --store-crash --row retention-crash-protocol

      - name: Test lifecycle operation idempotency corpus in isolated processes
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- corpus foundation --row lifecycle-operation-idempotency

      - name: Test publication crash corpus in isolated processes
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- corpus foundation --store-crash --row crash-publication

      - name: Test concurrent publication corpus in isolated processes
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- corpus foundation --store-crash --row concurrent-latest-publication

      - name: Test publication retention race corpus in isolated processes
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- corpus foundation --store-crash --row publication-retention-race

      - name: Test documentation
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo test --workspace --doc --locked

      - name: Build release binary
        run: python -I -S tools/xtask/bootstrap/source_provenance.py -- cargo build -p lumin-cli --release --locked

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - formatting
      - architecture-check
      - dependency-policy
      - platform
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required jobs
        env:
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          ARCHITECTURE_CHECK_RESULT: ${{ needs.architecture-check.result }}
          DEPENDENCY_POLICY_RESULT: ${{ needs.dependency-policy.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          test "$FORMATTING_RESULT" = success
          test "$ARCHITECTURE_CHECK_RESULT" = success
          test "$DEPENDENCY_POLICY_RESULT" = success
          test "$PLATFORM_RESULT" = success
