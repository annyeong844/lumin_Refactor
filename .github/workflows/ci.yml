name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: Change policy
    runs-on: ubuntu-24.04
    outputs:
      scope: ${{ steps.policy.outputs.scope }}
      run_full: ${{ steps.policy.outputs.run_full }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Record trusted Python
        shell: pwsh
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $python = & "$env:SETUP_PYTHON" -I -S -c "import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PINNED_PYTHON=$python" >> $env:GITHUB_ENV

      - name: Test CI policy
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/test_ci_policy.py'

      - name: Classify change and validate documentation
        id: policy
        shell: pwsh
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/ci_policy.py github'

  formatting:
    name: Formatting
    needs: policy
    if: ${{ needs.policy.outputs.run_full == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize isolated Cargo paths
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/lumin-cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lumin-target" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --no-self-update

      - name: Record trusted Cargo
        shell: pwsh
        run: |
          $cargo = rustup which --toolchain 1.96.0 cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PINNED_CARGO=$cargo" >> $env:GITHUB_ENV

      - name: Verify formatting
        shell: pwsh
        run: '& "$env:PINNED_CARGO" fmt --all --check'

  architecture-check:
    name: Architecture check
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize isolated Cargo paths
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/lumin-cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lumin-target" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      - name: Record trusted tools
        shell: pwsh
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $python = & "$env:SETUP_PYTHON" -I -S -c "import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargo = rustup which --toolchain 1.96.0 cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PINNED_PYTHON=$python" >> $env:GITHUB_ENV
          "PINNED_CARGO=$cargo" >> $env:GITHUB_ENV

      - name: Validate dependency admission
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py --check-only'

      - name: Build structural checker
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo build --locked -p lumin-xtask'

      - name: Enforce structural architecture policy
        shell: pwsh
        run: '& (Join-Path $env:CARGO_TARGET_DIR ''debug/lumin-xtask'') architecture-check'

  bootstrap-tests:
    name: Bootstrap tests
    needs: policy
    if: ${{ needs.policy.outputs.run_full == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Test source provenance bootstrap
        shell: pwsh
        env:
          PINNED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/test_source_provenance.py'

      - name: Test benchmark process observer
        shell: pwsh
        env:
          PINNED_PYTHON: ${{ steps.python.outputs.python-path }}
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/benchmark/test_measure_process.py'

  dependency-policy:
    name: Dependency policy
    needs: policy
    if: ${{ needs.policy.outputs.run_full == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Initialize isolated Cargo paths
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/lumin-cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lumin-target" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      - name: Install dependency policy tools
        uses: taiki-e/install-action@07b4745e0c39a41822af610387492e3e53aa222b # v2.83.4
        with:
          tool: |
            cargo-audit@0.22.2
            cargo-deny@0.20.2
          fallback: none

      - name: Record trusted tools
        shell: pwsh
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $python = & "$env:SETUP_PYTHON" -I -S -c "import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargo = rustup which --toolchain 1.96.0 cargo
          $auditCommand = (Get-Command cargo-audit -CommandType Application -ErrorAction Stop).Source
          $denyCommand = (Get-Command cargo-deny -CommandType Application -ErrorAction Stop).Source
          $audit = (Resolve-Path -LiteralPath $auditCommand -ErrorAction Stop).ProviderPath
          $deny = (Resolve-Path -LiteralPath $denyCommand -ErrorAction Stop).ProviderPath
          if ($LASTEXITCODE -ne 0 -or [IO.Path]::GetFileName($audit) -cne "cargo-audit$suffix" -or [IO.Path]::GetFileName($deny) -cne "cargo-deny$suffix") { exit 1 }
          "PINNED_PYTHON=$python" >> $env:GITHUB_ENV
          "PINNED_CARGO=$cargo" >> $env:GITHUB_ENV
          "PINNED_CARGO_AUDIT=$audit" >> $env:GITHUB_ENV
          "PINNED_CARGO_DENY=$deny" >> $env:GITHUB_ENV

      - name: Validate dependency admission
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py --check-only'

      - name: Audit RustSec advisories
        shell: pwsh
        run: '& "$env:PINNED_CARGO_AUDIT" audit --deny warnings'

      - name: Enforce dependency policy
        shell: pwsh
        run: '& "$env:PINNED_CARGO_DENY" --locked check bans licenses sources'

  platform:
    name: ${{ matrix.name }}
    needs: policy
    if: ${{ needs.policy.outputs.run_full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            test_scope: all
          - name: Windows lint
            os: windows-2022
            test_scope: lint
    runs-on: ${{ matrix.os }}
    steps:
      - name: Initialize isolated Cargo paths
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/lumin-cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lumin-target" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Record trusted tools
        shell: pwsh
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $python = & "$env:SETUP_PYTHON" -I -S -c "import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargo = rustup which --toolchain 1.96.0 cargo
          $clippy = rustup which --toolchain 1.96.0 cargo-clippy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PINNED_PYTHON=$python" >> $env:GITHUB_ENV
          "PINNED_CARGO=$cargo" >> $env:GITHUB_ENV
          "PINNED_CARGO_CLIPPY=$clippy" >> $env:GITHUB_ENV

      - name: Lint all targets
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy --workspace --all-targets --locked -- -D warnings'

      - name: Lint retention crash corpus
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test retention_faults --features retention-test-crash --locked -- -D warnings'

      - name: Lint lifecycle operation idempotency corpus
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test lifecycle_operation_idempotency --features lifecycle-test-fault --locked -- -D warnings'

      - name: Lint lifecycle migration corpus
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test lifecycle_store_migration --features lifecycle-test-fault,publication-test-crash --locked -- -D warnings'

      - name: Lint publication crash corpus
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test publication_faults --features publication-test-crash --locked -- -D warnings'

      - name: Lint concurrent publication corpus
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test publication_concurrency --features publication-test-crash --locked -- -D warnings'

      - name: Lint publication retention race corpus
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test publication_retention_race --features publication-test-crash,retention-test-crash --locked -- -D warnings'

      - name: Lint cache cleanup publication race corpus
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo clippy -p lumin-cli --test cache_cleanup_publication_race --features lifecycle-test-fault,publication-test-crash --locked -- -D warnings'

      - name: Test all targets
        if: ${{ matrix.test_scope == 'all' }}
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo test --workspace --all-targets --locked'

  windows-core:
    name: ${{ matrix.name }}
    needs: policy
    if: ${{ needs.policy.outputs.run_full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows core
            suite: core
            shard: 0
          - name: Windows store cache
            suite: store-lib
            shard: 0
          - name: Windows store gate
            suite: store-lib
            shard: 1
          - name: Windows store namespace
            suite: store-lib
            shard: 2
          - name: Windows store retention
            suite: store-lib
            shard: 3
          - name: Windows store evidence
            suite: store-lib
            shard: 4
    runs-on: windows-2022
    steps:
      - name: Initialize isolated Cargo paths
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/lumin-cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lumin-target" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      - name: Record trusted tools
        shell: pwsh
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $python = & "$env:SETUP_PYTHON" -I -S -c "import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargo = rustup which --toolchain 1.96.0 cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PINNED_PYTHON=$python" >> $env:GITHUB_ENV
          "PINNED_CARGO=$cargo" >> $env:GITHUB_ENV

      - name: Test Windows non-store core targets
        if: ${{ matrix.suite == 'core' }}
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo test --workspace --lib --bins --exclude lumin-store --locked'

      - name: Test Windows engine integration targets
        if: ${{ matrix.suite == 'core' }}
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo test --locked -p lumin-engine --test package_resolution --test vue_sfc'

      - name: Test Windows SFC integration targets
        if: ${{ matrix.suite == 'core' }}
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo test --locked -p lumin-sfc --test vue'

      - name: Test Windows store unit shard
        if: ${{ matrix.suite == 'store-lib' }}
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- ci-test-shard --suite store-lib --index ${{ matrix.shard }} --count 5'

  windows-integration:
    name: Windows integration ${{ matrix.shard }}/6
    needs: policy
    if: ${{ needs.policy.outputs.run_full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: windows-2022
    steps:
      - name: Initialize isolated Cargo paths
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/lumin-cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lumin-target" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      - name: Record trusted tools
        shell: pwsh
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $python = & "$env:SETUP_PYTHON" -I -S -c "import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargo = rustup which --toolchain 1.96.0 cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PINNED_PYTHON=$python" >> $env:GITHUB_ENV
          "PINNED_CARGO=$cargo" >> $env:GITHUB_ENV

      - name: Test integration shard
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- ci-test-shard --suite cli-integration --index ${{ matrix.shard }} --count 6 --jobs 4'

  corpus:
    name: ${{ matrix.os }} corpus ${{ matrix.name }}
    needs: policy
    if: ${{ needs.policy.outputs.run_full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: mapped-standard
            arguments: foundation --mapped-only --row-jobs 8
          - os: windows-2022
            name: mapped-standard-0
            arguments: foundation --mapped-only --row-jobs 6 --row-shard-index 0 --row-shard-count 4
          - os: windows-2022
            name: mapped-standard-1
            arguments: foundation --mapped-only --row-jobs 6 --row-shard-index 1 --row-shard-count 4
          - os: windows-2022
            name: mapped-standard-2
            arguments: foundation --mapped-only --row-jobs 6 --row-shard-index 2 --row-shard-count 4
          - os: windows-2022
            name: mapped-standard-3
            arguments: foundation --mapped-only --row-jobs 6 --row-shard-index 3 --row-shard-count 4
          - os: ubuntu-24.04
            name: mapped-determinism-0
            arguments: foundation --determinism --mapped-only --row-jobs 4 --row-shard-index 0 --row-shard-count 8
          - os: ubuntu-24.04
            name: mapped-determinism-1
            arguments: foundation --determinism --mapped-only --row-jobs 4 --row-shard-index 1 --row-shard-count 8
          - os: ubuntu-24.04
            name: mapped-determinism-2
            arguments: foundation --determinism --mapped-only --row-jobs 4 --row-shard-index 2 --row-shard-count 8
          - os: ubuntu-24.04
            name: mapped-determinism-3
            arguments: foundation --determinism --mapped-only --row-jobs 4 --row-shard-index 3 --row-shard-count 8
          - os: ubuntu-24.04
            name: mapped-determinism-4
            arguments: foundation --determinism --mapped-only --row-jobs 4 --row-shard-index 4 --row-shard-count 8
          - os: ubuntu-24.04
            name: mapped-determinism-5
            arguments: foundation --determinism --mapped-only --row-jobs 4 --row-shard-index 5 --row-shard-count 8
          - os: ubuntu-24.04
            name: mapped-determinism-6
            arguments: foundation --determinism --mapped-only --row-jobs 4 --row-shard-index 6 --row-shard-count 8
          - os: ubuntu-24.04
            name: mapped-determinism-7
            arguments: foundation --determinism --mapped-only --row-jobs 4 --row-shard-index 7 --row-shard-count 8
          - os: ubuntu-24.04
            name: retention-crash-protocol
            arguments: foundation --store-crash --row retention-crash-protocol
          - os: windows-2022
            name: retention-crash-protocol
            arguments: foundation --store-crash --row retention-crash-protocol
          - os: ubuntu-24.04
            name: retention-latest-protection
            arguments: foundation --store-crash --row retention-latest-protection
          - os: windows-2022
            name: retention-latest-protection
            arguments: foundation --store-crash --row retention-latest-protection
          - os: ubuntu-24.04
            name: retention-public-lookup
            arguments: foundation --store-crash --row retention-public-lookup
          - os: windows-2022
            name: retention-public-lookup
            arguments: foundation --store-crash --row retention-public-lookup
          - os: ubuntu-24.04
            name: state-namespace-initialization
            arguments: foundation --store-crash --row state-namespace-initialization
          - os: windows-2022
            name: state-namespace-initialization
            arguments: foundation --store-crash --row state-namespace-initialization
          - os: ubuntu-24.04
            name: state-lock-replacement-split-brain
            arguments: foundation --store-crash --row state-lock-replacement-split-brain
          - os: windows-2022
            name: state-lock-replacement-split-brain
            arguments: foundation --store-crash --row state-lock-replacement-split-brain
          - os: ubuntu-24.04
            name: state-managed-parent-replacement
            arguments: foundation --store-crash --row state-managed-parent-replacement
          - os: windows-2022
            name: state-managed-parent-replacement
            arguments: foundation --store-crash --row state-managed-parent-replacement
          - os: ubuntu-24.04
            name: crash-publication
            arguments: foundation --store-crash --row crash-publication
          - os: windows-2022
            name: crash-publication
            arguments: foundation --store-crash --row crash-publication
          - os: ubuntu-24.04
            name: concurrent-latest-publication
            arguments: foundation --store-crash --row concurrent-latest-publication
          - os: windows-2022
            name: concurrent-latest-publication
            arguments: foundation --store-crash --row concurrent-latest-publication
          - os: ubuntu-24.04
            name: publication-retention-race
            arguments: foundation --store-crash --row publication-retention-race
          - os: windows-2022
            name: publication-retention-race
            arguments: foundation --store-crash --row publication-retention-race
          - os: ubuntu-24.04
            name: lifecycle-store-migration
            arguments: foundation --store-crash --row lifecycle-store-migration
          - os: windows-2022
            name: lifecycle-store-migration
            arguments: foundation --store-crash --row lifecycle-store-migration
    runs-on: ${{ matrix.os }}
    steps:
      - name: Initialize isolated Cargo paths
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/lumin-cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lumin-target" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      - name: Record trusted tools
        shell: pwsh
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $python = & "$env:SETUP_PYTHON" -I -S -c "import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargo = rustup which --toolchain 1.96.0 cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PINNED_PYTHON=$python" >> $env:GITHUB_ENV
          "PINNED_CARGO=$cargo" >> $env:GITHUB_ENV

      - name: Run corpus partition
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- corpus ${{ matrix.arguments }}'

  documentation:
    name: ${{ matrix.os }} Rust documentation
    needs: policy
    if: ${{ needs.policy.outputs.run_full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Initialize isolated Cargo paths
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/lumin-cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lumin-target" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      - name: Record trusted tools
        shell: pwsh
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $python = & "$env:SETUP_PYTHON" -I -S -c "import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargo = rustup which --toolchain 1.96.0 cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PINNED_PYTHON=$python" >> $env:GITHUB_ENV
          "PINNED_CARGO=$cargo" >> $env:GITHUB_ENV

      - name: Test documentation
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo test --workspace --doc --locked'

  release:
    name: ${{ matrix.package_target }} package
    needs: policy
    if: ${{ needs.policy.outputs.run_full == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            package_target: linux-x64
            benchmark_environment: linux-release
            build_arguments: --target x86_64-unknown-linux-musl
            binary_path: x86_64-unknown-linux-musl/release/lumin
            fixture_binary_path: debug/lumin
          - os: windows-2022
            package_target: windows-x64
            benchmark_environment: windows-ntfs
            build_arguments: ""
            binary_path: release/lumin.exe
            fixture_binary_path: debug/lumin.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Initialize isolated Cargo paths
        shell: pwsh
        run: |
          "CARGO_HOME=$env:RUNNER_TEMP/lumin-cargo-home" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/lumin-target" >> $env:GITHUB_ENV

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install exact Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Install exact Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.96.0 --profile minimal --no-self-update

      - name: Install exact Linux musl target
        if: ${{ matrix.package_target == 'linux-x64' }}
        shell: pwsh
        run: rustup target add x86_64-unknown-linux-musl --toolchain 1.96.0

      - name: Install Linux musl C compiler
        if: ${{ matrix.package_target == 'linux-x64' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes musl-tools
          x86_64-linux-musl-gcc --version

      - name: Record trusted tools
        shell: pwsh
        env:
          SETUP_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          $python = & "$env:SETUP_PYTHON" -I -S -c "import pathlib,sys; print(pathlib.Path(sys.executable).resolve(strict=True))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cargo = rustup which --toolchain 1.96.0 cargo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "PINNED_PYTHON=$python" >> $env:GITHUB_ENV
          "PINNED_CARGO=$cargo" >> $env:GITHUB_ENV

      - name: Build release binary
        id: control_build
        shell: pwsh
        env:
          LUMIN_BUILD_REVISION: ${{ github.sha }}
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo build -p lumin-cli --release --locked ${{ matrix.build_arguments }}'

      - name: Build lifecycle migration fixture binary
        shell: pwsh
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo build -p lumin-cli --features lifecycle-test-fault --locked'

      - name: Stage packaged distribution
        id: package_stage
        shell: pwsh
        env:
          LUMIN_PACKAGE_BINARY: ${{ runner.temp }}/lumin-target/${{ matrix.binary_path }}
          LUMIN_PACKAGE_ROOT: ${{ runner.temp }}/lumin-package
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- package-check stage ${{ matrix.package_target }}'

      - name: Probe packaged binary without runtime build tools
        id: package_probe
        shell: pwsh
        env:
          LUMIN_PACKAGE_FIXTURE_BINARY: ${{ runner.temp }}/lumin-target/${{ matrix.fixture_binary_path }}
          LUMIN_PACKAGE_ROOT: ${{ runner.temp }}/lumin-package
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- package-check ${{ matrix.package_target }}'

      - name: Probe packaged skills
        id: skill_probe
        shell: pwsh
        env:
          LUMIN_PACKAGE_FIXTURE_BINARY: ${{ runner.temp }}/lumin-target/${{ matrix.fixture_binary_path }}
          LUMIN_PACKAGE_ROOT: ${{ runner.temp }}/lumin-package
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- package-check skills'

      - name: Benchmark packaged binary
        id: benchmark
        shell: pwsh
        env:
          LUMIN_BENCHMARK_ENVIRONMENT: ${{ matrix.benchmark_environment }}
          LUMIN_BENCHMARK_REPORT: ${{ runner.temp }}/lumin-foundation-benchmark-${{ matrix.package_target }}.json
          LUMIN_BENCHMARK_CAPTURE_ROOT: ${{ runner.temp }}/lumin-foundation-captures-${{ matrix.package_target }}
          LUMIN_PACKAGE_ROOT: ${{ runner.temp }}/lumin-package
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- benchmark foundation'

      - name: Build isolated Windows audit store diagnostic
        id: diagnostic_build
        if: ${{ always() && !cancelled() && matrix.package_target == 'windows-x64' && steps.control_build.outcome == 'success' && steps.package_stage.outcome == 'success' && steps.package_probe.outcome == 'success' && steps.skill_probe.outcome == 'success' }}
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/lumin-audit-store-diagnostic-target
          LUMIN_BUILD_REVISION: ${{ github.sha }}
        run: |
          & "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo build -p lumin-cli --release --features audit-store-test-profile --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo test -p lumin-model -p lumin-engine -p lumin-store --lib --features audit-store-test-profile audit_ --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $incompatible = & "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo check -p lumin-cli --bin lumin --features audit-store-test-profile,lifecycle-test-fault --locked 2>&1
          $incompatibleExit = $LASTEXITCODE
          $incompatible | ForEach-Object { Write-Output $_ }
          if ($incompatibleExit -eq 0 -or -not ($incompatible -match 'audit-execution-test-profile cannot be combined')) { throw 'incompatible diagnostic features were not refused by their owner' }
          $record = [ordered]@{
            sourceRevision = '${{ github.sha }}'
            lockfileSha256 = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
            controlFeatures = @()
            diagnosticFeatures = @('audit-store-test-profile')
            diagnosticFeatureClosure = [ordered]@{
              'lumin-cli' = @('audit-execution-test-profile', 'audit-store-test-profile')
              'lumin-engine' = @('audit-execution-test-profile', 'audit-store-test-profile')
              'lumin-model' = @('audit-execution-test-profile', 'audit-store-test-profile')
              'lumin-protocol' = @('audit-execution-test-profile', 'audit-store-test-profile')
              'lumin-store' = @('audit-store-test-profile')
            }
            target = 'x86_64-pc-windows-msvc'
            toolchain = '1.96.0'
            controlCommand = 'cargo build -p lumin-cli --release --locked'
            diagnosticCommand = 'cargo build -p lumin-cli --release --features audit-store-test-profile --locked'
            controlSha256 = (Get-FileHash "$env:RUNNER_TEMP/lumin-package/bin/lumin.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            diagnosticSha256 = (Get-FileHash "$env:CARGO_TARGET_DIR/release/lumin.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $recordPath = "$env:RUNNER_TEMP/lumin-audit-store-diagnostic-build.json"
          if (Test-Path -LiteralPath $recordPath) { throw 'diagnostic build record already exists' }
          [System.IO.File]::WriteAllText($recordPath, ($record | ConvertTo-Json -Depth 4), [System.Text.UTF8Encoding]::new($false))
          # The incompatible-feature check above is an expected native failure.
          exit 0

      - name: Probe diagnostic public transport
        id: diagnostic_probe
        if: ${{ always() && !cancelled() && steps.diagnostic_build.outcome == 'success' }}
        shell: pwsh
        env:
          LUMIN_AUDIT_DIAGNOSTIC_BINARY: ${{ runner.temp }}/lumin-audit-store-diagnostic-target/release/lumin.exe
          LUMIN_AUDIT_CONTROL_BINARY: ${{ runner.temp }}/lumin-package/bin/lumin.exe
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo test -p lumin-cli --test audit_store_diagnostic --features audit-execution-profile-probe --locked'

      - name: Diagnose Windows cold audit store
        id: diagnostic
        if: ${{ always() && !cancelled() && steps.diagnostic_build.outcome == 'success' && steps.diagnostic_probe.outcome == 'success' }}
        shell: pwsh
        env:
          LUMIN_PACKAGE_ROOT: ${{ runner.temp }}/lumin-package
          LUMIN_AUDIT_DIAGNOSTIC_BINARY: ${{ runner.temp }}/lumin-audit-store-diagnostic-target/release/lumin.exe
          LUMIN_AUDIT_DIAGNOSTIC_BUILD_RECORD: ${{ runner.temp }}/lumin-audit-store-diagnostic-build.json
          LUMIN_BENCHMARK_ENVIRONMENT: windows-ntfs
          LUMIN_BENCHMARK_REPORT: ${{ runner.temp }}/lumin-audit-store-diagnostic-report.json
          LUMIN_BENCHMARK_CAPTURE_ROOT: ${{ runner.temp }}/lumin-audit-store-diagnostic-captures
        run: '& "$env:PINNED_PYTHON" -I -S tools/xtask/bootstrap/source_provenance.py -- cargo run --locked -p lumin-xtask -- benchmark foundation --diagnose-cold-audit-store'

      - name: Retain benchmark report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumin-foundation-benchmark-${{ matrix.package_target }}
          path: |
            ${{ runner.temp }}/lumin-foundation-benchmark-${{ matrix.package_target }}.json
            ${{ runner.temp }}/lumin-foundation-captures-${{ matrix.package_target }}/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Retain Windows diagnostic packet even on failure
        if: ${{ always() && matrix.package_target == 'windows-x64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lumin-audit-store-diagnostic-windows-x64
          path: |
            ${{ runner.temp }}/lumin-audit-store-diagnostic-build.json
            ${{ runner.temp }}/lumin-audit-store-diagnostic-report.json
            ${{ runner.temp }}/lumin-audit-store-diagnostic-captures/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - policy
      - formatting
      - architecture-check
      - bootstrap-tests
      - dependency-policy
      - platform
      - windows-core
      - windows-integration
      - corpus
      - documentation
      - release
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce required jobs
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          POLICY_SCOPE: ${{ needs.policy.outputs.scope }}
          RUN_FULL: ${{ needs.policy.outputs.run_full }}
          EXPECTED_RUN_FULL: ${{ needs.policy.outputs.scope == 'full' && 'true' || 'false' }}
          EXPECTED_SCOPE: ${{ needs.policy.outputs.run_full == 'true' && 'full' || 'documentation' }}
          EXPECTED_HEAVY_RESULT: ${{ needs.policy.outputs.run_full == 'true' && 'success' || 'skipped' }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          ARCHITECTURE_CHECK_RESULT: ${{ needs.architecture-check.result }}
          BOOTSTRAP_TESTS_RESULT: ${{ needs.bootstrap-tests.result }}
          DEPENDENCY_POLICY_RESULT: ${{ needs.dependency-policy.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          WINDOWS_CORE_RESULT: ${{ needs.windows-core.result }}
          WINDOWS_INTEGRATION_RESULT: ${{ needs.windows-integration.result }}
          CORPUS_RESULT: ${{ needs.corpus.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          test "$ARCHITECTURE_CHECK_RESULT" = success
          test "$POLICY_RESULT" = success
          test "$RUN_FULL" = "$EXPECTED_RUN_FULL"
          test "$POLICY_SCOPE" = "$EXPECTED_SCOPE"
          test "$FORMATTING_RESULT" = "$EXPECTED_HEAVY_RESULT"
          test "$BOOTSTRAP_TESTS_RESULT" = "$EXPECTED_HEAVY_RESULT"
          test "$DEPENDENCY_POLICY_RESULT" = "$EXPECTED_HEAVY_RESULT"
          test "$PLATFORM_RESULT" = "$EXPECTED_HEAVY_RESULT"
          test "$WINDOWS_CORE_RESULT" = "$EXPECTED_HEAVY_RESULT"
          test "$WINDOWS_INTEGRATION_RESULT" = "$EXPECTED_HEAVY_RESULT"
          test "$CORPUS_RESULT" = "$EXPECTED_HEAVY_RESULT"
          test "$DOCUMENTATION_RESULT" = "$EXPECTED_HEAVY_RESULT"
          test "$RELEASE_RESULT" = "$EXPECTED_HEAVY_RESULT"
