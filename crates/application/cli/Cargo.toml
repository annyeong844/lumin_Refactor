[package]
name = "lumin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
lifecycle-test-fault = ["lumin-engine/cache-cleanup-test-fault"]
publication-test-crash = ["lumin-engine/publication-test-crash"]
retention-test-crash = ["lumin-engine/retention-test-crash"]

[[bin]]
name = "lumin"
path = "src/main.rs"

[[test]]
name = "lifecycle_operation_idempotency"
path = "tests/lifecycle_operation_idempotency.rs"
required-features = ["lifecycle-test-fault"]

[[test]]
name = "retention_faults"
path = "tests/retention_faults.rs"
required-features = ["retention-test-crash"]

[[test]]
name = "publication_faults"
path = "tests/publication_faults.rs"
required-features = ["publication-test-crash"]

[[test]]
name = "publication_concurrency"
path = "tests/publication_concurrency.rs"
required-features = ["publication-test-crash"]

[[test]]
name = "publication_retention_race"
path = "tests/publication_retention_race.rs"
required-features = ["publication-test-crash", "retention-test-crash"]

[[test]]
name = "cache_cleanup_publication_race"
path = "tests/cache_cleanup_publication_race.rs"
required-features = ["lifecycle-test-fault", "publication-test-crash"]

[dependencies]
lumin-engine = { path = "../engine" }
lumin-model = { path = "../../foundation/model" }
lumin-protocol = { path = "../protocol" }
thiserror.workspace = true

[dev-dependencies]
base64.workspace = true
lumin-engine = { path = "../engine", features = ["gate-test-fault"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
