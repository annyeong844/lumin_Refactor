[package]
name = "lumin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
audit-execution-profile-probe = []
audit-execution-test-profile = [
    "lumin-engine/audit-execution-test-profile",
    "lumin-model/audit-execution-test-profile",
    "lumin-protocol/audit-execution-test-profile",
]
collection-ordering-test-perturb = [
    "lumin-engine/collection-ordering-test-perturb",
    "lumin-protocol/collection-ordering-test-perturb",
]
lifecycle-test-fault = [
    "lumin-engine/cache-cleanup-test-fault",
    "lumin-engine/lifecycle-migration-test-fault",
    "lumin-engine/namespace-test-crash",
    "lumin-engine/publication-test-crash",
]
publication-test-crash = ["lumin-engine/publication-test-crash"]
retention-test-crash = ["lumin-engine/retention-test-crash"]

[[bin]]
name = "lumin"
path = "src/main.rs"

[[test]]
name = "audit_diagnostic"
path = "tests/audit_diagnostic.rs"
required-features = ["audit-execution-profile-probe"]

[[test]]
name = "lifecycle_operation_idempotency"
path = "tests/lifecycle_operation_idempotency.rs"
required-features = ["lifecycle-test-fault"]

[[test]]
name = "lifecycle_store_migration"
path = "tests/lifecycle_store_migration.rs"
required-features = ["lifecycle-test-fault"]

[[test]]
name = "state_namespace_initialization"
path = "tests/state_namespace_initialization.rs"
required-features = ["lifecycle-test-fault"]

[[test]]
name = "state_namespace_replacement"
path = "tests/state_namespace_replacement.rs"
required-features = ["lifecycle-test-fault"]

[[test]]
name = "retention_faults"
path = "tests/retention_faults.rs"
required-features = ["retention-test-crash"]

[[test]]
name = "publication_faults"
path = "tests/publication_faults.rs"
required-features = ["publication-test-crash"]

[[test]]
name = "publication_concurrency"
path = "tests/publication_concurrency.rs"
required-features = ["publication-test-crash"]

[[test]]
name = "publication_retention_race"
path = "tests/publication_retention_race.rs"
required-features = ["publication-test-crash", "retention-test-crash"]

[[test]]
name = "cache_cleanup_publication_race"
path = "tests/cache_cleanup_publication_race.rs"
required-features = ["lifecycle-test-fault", "publication-test-crash"]

[dependencies]
lumin-engine = { path = "../engine" }
lumin-model = { path = "../../foundation/model" }
lumin-protocol = { path = "../protocol" }
thiserror.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc.workspace = true

[dev-dependencies]
base64.workspace = true
lumin-engine = { path = "../engine", features = ["gate-test-fault", "logical-store-snapshot-test"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
