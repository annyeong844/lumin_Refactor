[package]
name = "lumin-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
audit-store-test-profile = ["audit-execution-test-profile", "lumin-model/audit-store-test-profile", "lumin-store/audit-store-test-profile"]
audit-execution-test-profile = ["lumin-model/audit-execution-test-profile"]
cache-cleanup-test-fault = ["lumin-store/cache-cleanup-test-fault"]
